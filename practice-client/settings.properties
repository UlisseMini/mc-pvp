# Automatically reloaded about once per second. /practice reload reloads now.
# Press your ordinary Sprint key (currently R) to toggle sprint.
sprint.enabled=true
sprint.startEnabled=true
sprint.label=[Sprinting (Toggled)]
hud.rightInset=6
hud.top=6
hud.color=55FFFF
potions.enabled=true
potions.top=22
# Optional practice readouts.
metrics.enabled=false
record.enabled=false
feedback.hurtFlash=false
# Automatic compressed captures of PLAY traffic and observed state on localhost.
# Login/authentication traffic is never captured. Local PLAY chat is included.
capture.enabled=true
capture.frames=true
link.enabled=true
# Geometric opening lead; positive = you entered range first. Not a hit prediction.
opening.enabled=true
opening.large=true
reach.enabled=false
ghost.bot.enabled=false
ghost.me.enabled=false
# Delivery/draw age is shown only in this optional diagnostic view.
debug.enabled=false

# Automatically reloaded about once per second. /practice reload reloads now.
# Press your ordinary Sprint key (currently R) to toggle sprint.
sprint.enabled=true
sprint.startEnabled=true
sprint.label=[Sprinting (Toggled)]
hud.rightInset=6
hud.top=6
hud.color=55FFFF
potions.enabled=true
potions.top=22
# Optional practice readouts.
metrics.enabled=false
record.enabled=false
feedback.hurtFlash=false
# Client-side combat coaches and cosmetic 1.7 sword animation.
jumpreset.enabled=false
blockhit.enabled=false
jumpreset.hud=hotbar
blockhit.hud=hotbar
jumpreset.sound=orb
oldblock.enabled=true
oldsneak.enabled=true
# Automatic compressed captures of PLAY traffic and observed state on localhost.
# Login/authentication traffic is never captured. Local PLAY chat is included.
capture.enabled=true
capture.frames=true
# Remote recording is session-only: /p remote record on/off (off each launch).
link.enabled=true
# Geometric opening lead; positive = you entered range first. Not a hit prediction.
opening.enabled=true
opening.large=true
reach.enabled=false
ghost.bot.enabled=false
ghost.me.enabled=false
# Delivery/draw age is shown only in this optional diagnostic view.
debug.enabled=false

# d1 (their view of you) - d2 (your view of them): positive favors you.
advantage.enabled=true
# Independent ideal-aim range indicators. Styles: crosshair, edge, screen, off.
# Auto opacity: your brackets 85%, their brackets 55%, edges 12%, screen tint 6%.
# Explicit opacity is 0–100. Pulse briefly brightens on entry; exits are immediate.
range.yours.enabled=true
range.yours.style=crosshair
range.yours.color=55AAFF
range.yours.opacity=auto
range.yours.pulse=false
range.theirs.enabled=true
range.theirs.style=crosshair
range.theirs.color=FF5555
range.theirs.opacity=auto
range.theirs.pulse=false
# The installer adds archive.directory pointing at this lab runtime/pov folder.
